<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scene</title>
<!--
  Starter for a single-scene film (≤ ~35 s). Longer, multi-scene films: start from
  examples/showreel/ (mg-film.js) instead.

  Copy next to it: mg-kit.js (and fonts/, assets/ as needed). Replace every value in
  CONTENT and the :root colours with the user's — the placeholders are neutral on purpose.

    $PY scripts/render_frames.py --scene scene.html --dur 12 --out tmp/check --at 0.8,2.4,4.2,6.5,9.5,11.5
    $PY scripts/render_frames.py --scene scene.html --dur 12 --preview --video tmp/preview.mp4

  Contract: window.__render(frame) is pure (frame may be fractional — motion blur);
  no Date.now(), no Math.random() at render time, no CSS animation/transition.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#0E0E11;--ink:#F2F0EA;--muted:#8E8C96;--accent:#E8C35A}
html,body{background:var(--paper);overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--paper);color:var(--ink)}
.stack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:max-content}
.disp{font-family:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;font-weight:800;letter-spacing:-.035em;line-height:.95}
.body{font-family:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;font-weight:500}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-weight:500;letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:"SF Mono",Menlo,monospace;font-weight:700;color:var(--accent)}
#fade{position:absolute;inset:0;background:var(--paper);pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="stack" id="s1">
    <div class="mono" id="kicker" data-deco></div>
    <div class="disp" id="title"></div>
    <div class="num" id="count"></div>
    <div class="body" id="line"></div>
  </div>
  <div class="stack" id="s2"><div class="disp" id="end"></div><div class="mono" id="url"></div></div>
  <div id="fade"></div>
</div>
<script src="mg-kit.js"></script>
<script>
/* ================= CONTENT — everything a client can name lives here ================= */
const P = new URLSearchParams(location.search);
const KICKER = 'Announcement', TITLE = 'Your headline', NUMBER = P.get('n') || '20,000,000';
const LINE = 'One line that says why it matters.', END = 'BRAND', URL = 'example.com';

/* ================= SIZE ================= */
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080), FPS = +(P.get('fps') || 60), DUR = +(P.get('dur') || 12);
const S = Math.sqrt(W * H / (1920 * 1080)), PORT = W / H < 0.92;
const $ = id => document.getElementById(id), E = MG.ease;
$('stage').style.width = W + 'px'; $('stage').style.height = H + 'px';
// --alpha renders (layers composited onto footage): no background, no fade-to-black — foreground only
const ALPHA = P.get('alpha') === '1';
if (ALPHA) { document.documentElement.style.setProperty('--paper', 'transparent'); $('fade').style.display = 'none'; }

/* ================= TIMELINE — ● anchors on bar lines (paste MUSIC from music_grid.py), · content-timed ================= */
const T = {
  kicker: 0.40,      // ·
  title:  0.70,      // ·
  count:  2.00,      // ● the number starts rolling
  lock:   4.00,      // ● the number locks — the one hard moment
  line:   4.45,      // · reads after the lock settles
  out:    7.60,      // ·
  end:    8.00,      // ● end board
  hold:   8.60,      // · end board settled: poster frame from here
};
MG.cut(T.end); MG.hold(T.hold, DUR); MG.blur(T.count, T.lock);

/* ================= LAYOUT ================= */
$('kicker').textContent = KICKER; $('kicker').style.fontSize = 18 * S + 'px';
$('title').textContent = TITLE; $('title').style.fontSize = (PORT ? 120 : 140) * S + 'px'; $('title').style.marginTop = 18 * S + 'px';
$('count').style.fontSize = 150 * S + 'px'; $('count').style.marginTop = 30 * S + 'px';
$('line').textContent = LINE; $('line').style.fontSize = 38 * S + 'px'; $('line').style.marginTop = 26 * S + 'px';
$('end').style.fontSize = 180 * S + 'px';
$('url').textContent = URL; $('url').style.fontSize = 26 * S + 'px'; $('url').style.marginTop = 28 * S + 'px';

let kick, title, line, counter, end;

window.__render = function (frame) {
  const t = frame / FPS;
  const out = MG.at(t, T.out, T.end, E.in);
  MG.reveal(kick, t, T.kicker, { style: 'sweep', dur: 0.6 });
  MG.reveal(title, t, T.title, { style: 'mask', each: 0.035, dur: 0.75, out: T.out });
  counter.at(t);
  $('count').style.opacity = MG.at(t, T.count - 0.15, T.count + 0.1) * (1 - out);
  $('count').style.transform = `scale(${1 + 0.06 * MG.imp(t, T.lock, 0.35)})`;     // the lock lands
  MG.reveal(line, t, T.line, { style: 'sweep', dur: 1.1, tint: '#E8C35A', color: '#F2F0EA', out: T.out });
  $('s1').style.display = t < T.end ? '' : 'none';
  $('s2').style.display = t >= T.end ? '' : 'none';
  end.at(t);
  MG.clip($('url'), MG.at(t, T.end + 1.0, T.end + 1.4, E.snap), 'left');
  $('s2').style.transform = `translate(-50%,-50%) scale(${1 - 0.012 * Math.max(0, t - T.end)})`;   // end board keeps breathing
  if (!ALPHA) $('fade').style.opacity = MG.at(t, DUR - 0.5, DUR, E.inOut);
};

document.fonts.ready.then(() => {
  kick = MG.split($('kicker'), 'chars');
  title = MG.split($('title'), 'chars');
  line = MG.split($('line'), 'words');
  counter = MG.counter($('count'), NUMBER, { t0: T.count, t1: T.lock, stagger: 0.1 });
  end = MG.decode($('end'), END, { t0: T.end + 0.1, each: 0.11 });
  MG.ready();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>sculpture demo</title>
<!--
  Procedural tube sculpture in a white studio: chrome / pearl / glass / lime strands,
  soft floor shadow, macro → wide reveal, then a slow orbit with breathing deformation.
    $PY scripts/render_frames.py --scene examples/sculpture-demo.html --root . --dur 8 --preview --video /tmp/sculpt.mp4
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#F2EFE8;overflow:hidden}
#stage{position:relative;overflow:hidden}
#gl{position:absolute;left:0;top:0}
.lab{position:absolute;font:500 13px/1.3 "IBM Plex Mono","SF Mono",Menlo,monospace;letter-spacing:.08em;color:#0D0D0E;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas>
  <div class="lab" id="l1" data-deco>Study 05 — Continuous form</div>
  <div class="lab" id="l2" data-deco>Strands 5 · Seed 0007</div>
  <div class="lab" id="l3" data-deco>t 00.000</div>
</div>
<script src="../assets/mg-kit.js"></script>
<script type="module">
import { stage3d, studioEnv, studioLights, sculpture, softShadows, rig, orbit, THREE } from '../assets/mg-three.js';
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080), FPS = +(P.get('fps') || 60);
const S = Math.sqrt(W * H / (1920 * 1080)), E = MG.ease;
document.getElementById('stage').style.cssText = `width:${W}px;height:${H}px`;
const g = MG.grid({ W, H, cols: 12, rows: 8 });
[['l1', g.cell(0, 0)], ['l2', g.cell(9, 0)], ['l3', g.cell(0, 7)]].forEach(([id, r]) => {
  const el = document.getElementById(id); MG.place(el, { x: r.x, y: r.y }); el.style.fontSize = 13 * S + 'px';
});

const st = stage3d(document.getElementById('gl'), W, H, { background: '#F2EFE8', distance: 9, fov: 30, exposure: 0.95 });
studioEnv(st, { base: '#2E2E32', key: 10, rimA: '#ffffff', rimB: '#D4FF3A', rim: 3.5, intensity: 1.0 });   // dark room + bright softboxes = contrasty chrome
const L = studioLights(st.scene, { key: 2.4, fill: 0.5, rim: 0, ambient: 0.6 });
L.key.position.set(-3, 9, 5);
softShadows(st, L.key, { y: -2.9, opacity: 0.14, radius: 18 });
const sc = sculpture({ strands: 5, seed: 7, size: 1.75, radius: [0.16, 0.38], breathe: 0.12 });
st.scene.add(sc.group);

window.__render = function (frame) {
  const t = frame / FPS;
  sc.update(t);
  sc.group.rotation.y = t * 0.16;
  sc.group.rotation.x = 0.25 + 0.06 * Math.sin(t * 0.3);
  if (t < 4.5) rig(st.camera, t, [[0, [0.6, 0.5, 2.6], [0.9, 0.3, 0]], [4.5, [1.2, 1.6, 11.5], [-1.4, 0, 0]]], E.inOut);   // macro → wide
  else orbit(st.camera, t - 4.5, { radius: 11.8, height: 1.6, speed: 0.11, phase: Math.atan2(2.6, 11.5), target: [-1.4, 0, 0] });   // camera aims left of the object, so it sits right of centre: asymmetric, label space on the left
  st.render();
  document.getElementById('l3').textContent = 't ' + t.toFixed(3).padStart(6, '0');
};
MG.ready();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aaaai-editor Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 项目首页 -->
<main class="home" id="home" hidden>
  <h1>aaaai-editor Studio</h1>
  <div class="sub" id="homeSub">选一个项目开始剪辑</div>
  <div class="grid" id="grid"></div>
</main>

<!-- 编辑器 -->
<div class="app" id="app" hidden>
  <header class="top">
    <button class="btn sm" id="back" title="回到项目首页">← 项目</button>
    <span class="brand">Studio<small id="projName"></small></span>
    <span class="save" id="save"></span>
    <span class="spacer"></span>
    <div class="job" id="job" hidden><span id="jobLabel"></span><span class="pbar"><i id="jobBar"></i></span><span id="jobPct"></span><button class="btn sm" id="jobCancel">取消</button></div>
    <label class="chip" for="styleSel">风格
      <select id="styleSel" style="background:none;border:0;padding:0 2px;"></select>
    </label>
    <button class="btn" id="undo" title="复原（⌘Z／Ctrl+Z）">复原</button>
    <button class="btn" id="redo" title="重做（⇧⌘Z／Ctrl+Y）">重做</button>
    <button class="btn" id="renderRange" title="只渲染选中的那一段（或播放头前后），几秒钟看到引擎的真样子（R）">渲染这一段</button>
    <button class="btn primary" id="export" title="按目前的剪辑表出正式成片">出片</button>
    <button class="btn sm" id="more" title="快捷键、诊断报告">⋯</button>
  </header>

  <section class="main">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <video id="video" playsinline preload="auto" muted></video>
        <div class="scrim" id="scrim"></div>
        <div class="truelook" id="truelook"></div>
        <div id="layer"></div>
        <span class="badge" id="badge">近似预览</span>
        <div class="wait" id="wait" hidden></div>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-insp" aria-selected="true" data-pane="insp">属性</button>
        <button role="tab" id="tab-tr" aria-selected="false" data-pane="tr">逐字稿</button>
        <button role="tab" id="tab-chk" aria-selected="false" data-pane="chk">体检<span class="n" id="chkN" hidden></span></button>
      </div>
      <div class="pane" id="pane-insp" role="tabpanel" aria-labelledby="tab-insp"></div>
      <div class="pane" id="pane-tr" role="tabpanel" aria-labelledby="tab-tr" hidden></div>
      <div class="pane" id="pane-chk" role="tabpanel" aria-labelledby="tab-chk" hidden></div>
    </aside>
  </section>

  <div class="transport">
    <button class="btn" id="play" title="播放／暂停（空格）">▶ 播放</button>
    <button class="btn sm" id="mute" title="声音开关（M）">🔇</button>
    <span class="tc" id="tc">00:00.00</span>
    <span class="hint" id="roNote" hidden></span>
    <span class="spacer"></span>
    <label class="zoom" for="zoom">缩放 <input id="zoom" type="range" min="6" max="120" value="18"></label>
  </div>
  <div class="timeline" id="timeline">
    <div class="tl-labels" id="labels"></div>
    <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner"></div></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<script src="app.js"></script>
</body>
</html>
